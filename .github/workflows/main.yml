name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 拉代码
      - name: Checkout repo
        uses: actions/checkout@v4

      # 安装 Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 安装依赖
      - name: Install deps
        run: npm ci

      # TS 类型检查
      - name: Type check
        run: npm run typecheck || echo "skip"

      # ESLint
      - name: Lint
        run: npm run lint || echo "skip"

      # 单元测试
      - name: Test
        run: npm test -- --watch=false || echo "skip"

      # 构建
      - name: Build
        run: npm run build
